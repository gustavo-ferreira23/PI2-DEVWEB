<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width,initial-scale=1" >
    <link rel="stylesheet" href="./css/style.css" >
    <title>Adicionar cartão — Mercurius</title>
  </head>
  <body class="corpo-aplicativo">
    <aside class="barra-lateral">
      <a class="logo claro" href="./index.html">
        <span> M </span>
        Mercurius
      </a>
      <a class="nova-acao" href="./nova-movimentacao.html">
        + Nova movimentação
      </a>
      <nav class="navegacao-lateral">
        <a href="./dashboard.html"> Visão geral </a>
        <a href="./contas.html"> Contas </a>
        <a class="ativo" href="./cartoes.html"> Cartões </a>
        <a href="./produtos.html"> Produtos </a>
        <a href="./movimentacoes.html"> Movimentações </a>
        <a href="./configuracoes.html"> Configurações </a>
      </nav>
      <a class="sair" href="./login.html"> ← Sair da conta </a>
    </aside>
    <div class="aplicativo aplicativo-registro">
      <header class="cabecalho-registro">
        <a class="logo" href="./dashboard.html">
          <span> M </span>
          Mercurius
        </a>
        <a href="./cartoes.html"> Cancelar </a>
      </header>
      <main class="principal-registro">
        <div class="titulo-registro">
          <a href="./cartoes.html"> ← Voltar para cartões </a>
          <h1>Adicionar cartão</h1>
          <p>Vincule o cartão a uma das suas contas.</p>
        </div>
        <form class="cartao-registro" action="./cartoes.html">
          <div class="grade-formulario">
            <label class="completo">
              Descrição do cartão
              <input required placeholder="Ex.: Cartão principal" >
            </label>
            <label>
              Conta vinculada
              <select>
                <option>Conta principal</option>
                <option>Reserva</option>
              </select>
            </label>
            <label>
              Bandeira
              <select>
                <option>Visa</option>
                <option>Mastercard</option>
                <option>Elo</option>
                <option>American Express</option>
                <option>Hipercard</option>
                <option>Outra</option>
              </select>
            </label>
            <label>
              Limite
              <input type="number" required step=".01" >
            </label>
            <label>
              Dia de fechamento
              <input type="number" required min="1" max="31" >
            </label>
            <label>
              Dia de vencimento
              <input type="number" required min="1" max="31" >
            </label>
          </div>
          <div class="acoes-registro">
            <a class="botao contorno" href="./cartoes.html"> Cancelar </a>
            <button class="botao primario">Salvar cartão</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
