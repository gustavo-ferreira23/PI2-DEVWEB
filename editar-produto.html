<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Editar produto — Mercurius</title>
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <a class="logo light" href="/"><span>M</span>Mercurius</a
      ><a class="new-action" href="/nova-movimentacao.html">＋ Nova movimentação</a>
      <nav class="side-nav">
        <a href="/dashboard.html"
          ><svg><use href="/icons.svg#home" /></svg>Visão geral</a
        ><a href="/contas.html"
          ><svg><use href="/icons.svg#wallet" /></svg>Contas</a
        ><a href="/cartoes.html"
          ><svg><use href="/icons.svg#card" /></svg>Cartões</a
        ><a class="active" href="/produtos.html"
          ><svg><use href="/icons.svg#box" /></svg>Produtos</a
        ><a href="/movimentacoes.html"
          ><svg><use href="/icons.svg#swap" /></svg>Movimentações</a
        ><a href="/configuracoes.html"
          ><svg><use href="/icons.svg#settings" /></svg>Configurações</a
        >
      </nav>
      <div class="sync-box">
        <svg><use href="/icons.svg#shield" /></svg>
        <div><b>Dados protegidos</b><small>Dados atualizados</small></div>
      </div>
    </aside>
    <div class="app record-app">
      <header class="record-header">
        <a class="logo" href="/dashboard.html"><span>M</span>Mercurius</a
        ><a href="/produtos.html">Cancelar</a>
      </header>
      <main class="record-main">
        <div class="record-title">
          <a href="/produtos.html">← Voltar para produtos</a>
          <h1>Editar produto</h1>
          <p>Atualize o estado e as datas do produto selecionado.</p>
        </div>
        <form class="record-card" action="/produtos.html">
          <div class="form-grid">
            <label class="full">Descrição do produto<input required value="Leite integral" /></label
            ><label
              >Status<select>
                <option>Aberto</option>
                <option>Fechado</option>
                <option>Consumido</option>
                <option>Vencido</option>
                <option>Descartado</option>
              </select></label
            ><label
              >Compra de origem<select>
                <option>Mercado do Bairro</option>
                <option>Sem vínculo</option>
              </select></label
            ><label>Data de entrada<input type="date" required value="2025-06-18" /></label
            ><label>Data de vencimento<input type="date" value="2025-06-24" /></label>
          </div>
          <div class="record-actions">
            <a class="button outline" href="/produtos.html">Cancelar</a
            ><button class="button primary">Salvar alterações</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
