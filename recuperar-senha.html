<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width,initial-scale=1" >
    <link rel="stylesheet" href="./css/style.css" >
    <title>Recuperar senha — Mercurius</title>
  </head>
  <body class="pagina-autenticacao">
    <aside class="lateral-autenticacao">
      <a class="voltar" href="./index.html"> ← Voltar ao início </a>
      <a class="logo claro" href="./index.html">
        <span> M </span>
        Mercurius
      </a>
      <div class="citacao">
        <blockquote>
          Seu acesso pode ser recuperado de forma simples e segura.
        </blockquote>
      </div>
    </aside>
    <main class="principal-autenticacao">
      <section class="cartao-autenticacao">
        <h1>Recupere seu acesso</h1>
        <p>Informe o e-mail principal vinculado à sua conta.</p>
        <form action="./login.html">
          <label>
            E-mail
            <input
              type="email"
              required
              maxlength="320"
              placeholder="voce@exemplo.com"
            >
          </label>
          <button class="botao primario completo" type="submit">
            Enviar instruções
          </button>
        </form>
        <p class="troca-autenticacao">
          <a href="./login.html"> ← Voltar para o login </a>
        </p>
      </section>
    </main>
  </body>
</html>
