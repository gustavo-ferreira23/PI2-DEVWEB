<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <title>
      Recuperar senha — Mercurius
    </title>
  </head>
  <body class="auth-page">
    <aside class="auth-aside">
      <a class="back" href="./index.html">
        ← Voltar ao início
      </a >
      <a class="logo light" href="./index.html">
        <span>
          M
        </span>
        Mercurius
      </a>
      <div class="quote">
        <blockquote>
          Seu acesso pode ser recuperado de forma simples e segura.
        </blockquote>
      </div>
    </aside>
    <main class="auth-main">
      <section class="auth-card">
        <h1>
          Recupere seu acesso
        </h1>
        <p>
          Informe o e-mail principal vinculado à sua conta.
        </p>
        <form action="./login.html">
          <label >
            E-mail
            <input type="email" required maxlength="320" placeholder="voce@exemplo.com"/>
          </label >
          <button class="button primary full" type="submit">
            Enviar instruções
          </button>
        </form>
        <p class="switch">
          <a href="./login.html">
            ← Voltar para o login
          </a>
        </p>
      </section>
    </main>
  </body>
</html>
