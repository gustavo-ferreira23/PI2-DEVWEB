<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="./css/style.css"/>
    <title>
      Criar conta — Mercurius
    </title>
  </head>
  <body class="auth-page">
    <aside class="auth-aside">
      <a class="back" href="./index.html">
        ← Voltar ao início
      </a >
      <a class="logo light" href="./index.html">
        <span>
          M
        </span>
        Mercurius
      </a>
      <div class="quote">
        <blockquote>
          Organize seus alimentos, vencimentos e compras em um só lugar.
        </blockquote>
        <p>
          Seus dados tratados com transparência.
        </p>
      </div>
    </aside>
    <main class="auth-main">
      <section class="auth-card">
        <a class="logo auth-logo" href="">
          <span>
            M
          </span>
          Mercurius
        </a>
        <h1>
          Crie sua conta
        </h1>
        <p>
          Preencha seus dados para começar.
        </p>
        <form action="./dashboard.html">
          <label>
            Nome de exibição
            <input required maxlength="150" placeholder="Como deseja ser identificado?"/>
          </label>
          <label>
            E-mail principal
            <input type="email" required maxlength="320" placeholder="voce@exemplo.com"/>
          </label>
          <label>
            Senha
            <input type="password" required minlength="8" placeholder="Mínimo de 8 caracteres"/>
          </label>
          <label class="check">
            <input type="checkbox" required/>
            Li e aceito os Termos de uso e a Política de privacidade.
          </label>
          <button class="button primary full" type="submit">
            Criar minha conta →
          </button>
        </form>
        <p class="switch">
          Já possui uma conta?
          <a href="./login.html">
            Entrar
          </a>
        </p>
      </section>
    </main>
  </body>
</html>
