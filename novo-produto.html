<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Adicionar produto — Mercurius</title>
  </head>
  <body class="corpo-aplicativo">
    <aside class="barra-lateral">
      <a class="logo claro" href="./index.html">
        <span> M </span>
        Mercurius
      </a>
      <a class="nova-acao" href="./nova-movimentacao.html">
        + Nova movimentação
      </a>
      <nav class="navegacao-lateral">
        <a href="./dashboard.html"> Visão geral </a>
        <a href="./contas.html"> Contas </a>
        <a href="./cartoes.html"> Cartões </a>
        <a class="ativo" href="./produtos.html"> Produtos </a>
        <a href="./movimentacoes.html"> Movimentações </a>
        <a href="./configuracoes.html"> Configurações </a>
      </nav>
      <a class="sair" href="./login.html"> ← Sair da conta </a>
    </aside>
    <div class="aplicativo aplicativo-registro">
      <header class="cabecalho-registro">
        <a class="logo" href="./dashboard.html">
          <span> M </span>
          Mercurius
        </a>
        <a href="./produtos.html"> Cancelar </a>
      </header>
      <main class="principal-registro">
        <div class="titulo-registro">
          <a href="./produtos.html"> ← Voltar para produtos </a>
          <h1>Adicionar produto</h1>
          <p>Cadastre um produto para acompanhar seu uso e vencimento.</p>
        </div>
        <form class="cartao-registro" action="./produtos.html">
          <div class="grade-formulario">
            <label class="completo">
              Descrição do produto
              <input
                required
                maxlength="150"
                placeholder="Ex.: Leite integral"
              />
            </label>
            <label>
              Status
              <select>
                <option>Fechado</option>
                <option>Aberto</option>
                <option>Consumido</option>
                <option>Vencido</option>
                <option>Descartado</option>
              </select>
            </label>
            <label>
              Compra de origem
              <select>
                <option>Sem vínculo</option>
                <option>Compra no Mercado do Bairro</option>
                <option>Compra no Empório da Vila</option>
              </select>
            </label>
            <label>
              Data de entrada
              <input type="date" required />
            </label>
            <label>
              Data de vencimento
              <input type="date" />
            </label>
          </div>
          <div class="acoes-registro">
            <a class="botao contorno" href="./produtos.html"> Cancelar </a>
            <button class="botao primario">Salvar produto</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
