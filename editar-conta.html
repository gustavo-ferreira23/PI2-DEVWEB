<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Editar conta — Mercurius</title>
  </head>
  <body class="corpo-aplicativo">
    <aside class="barra-lateral">
      <a class="logo claro" href="./index.html">
        <span> M </span>
        Mercurius
      </a>
      <a class="nova-acao" href="./nova-movimentacao.html">
        + Nova movimentação
      </a>
      <nav class="navegacao-lateral">
        <a href="./dashboard.html"> Visão geral </a>
        <a class="ativo" href="./contas.html"> Contas </a>
        <a href="./cartoes.html"> Cartões </a>
        <a href="./produtos.html"> Produtos </a>
        <a href="./movimentacoes.html"> Movimentações </a>
        <a href="./configuracoes.html"> Configurações </a>
      </nav>
      <a class="sair" href="./login.html"> ← Sair da conta </a>
    </aside>
    <div class="aplicativo aplicativo-registro">
      <header class="cabecalho-registro">
        <a class="logo" href="./dashboard.html">
          <span> M </span>
          Mercurius
        </a>
        <a href="./contas.html"> Cancelar </a>
      </header>
      <main class="principal-registro">
        <div class="titulo-registro">
          <a href="./contas.html"> ← Voltar para contas </a>
          <h1>Editar conta</h1>
          <p>Atualize as informações da conta selecionada.</p>
        </div>
        <form class="cartao-registro" action="./contas.html">
          <div class="grade-formulario">
            <label class="completo">
              Descrição da conta
              <input required value="Conta principal" />
            </label>
            <label>
              Instituição
              <select>
                <option>Banco Aurora</option>
                <option>Banco Horizonte</option>
              </select>
            </label>
            <label>
              Tipo de conta
              <select>
                <option>Corrente</option>
                <option>Poupança</option>
                <option>Investimento</option>
              </select>
            </label>
            <label class="completo">
              Saldo atual
              <input type="number" required step="0.01" value="8240.54" />
            </label>
          </div>
          <div class="acoes-registro">
            <a class="botao contorno" href="./contas.html"> Cancelar </a>
            <button class="botao primario">Salvar alterações</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
