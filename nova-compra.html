<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Nova compra — Mercurius</title>
  </head>
  <body class="app-body">
    <aside class="sidebar">
      <a class="logo light" href="/"><span>M</span>Mercurius</a
      ><a class="new-action" href="/nova-movimentacao.html">＋ Nova movimentação</a>
      <nav class="side-nav">
        <a href="/dashboard.html"
          ><svg><use href="/icons.svg#home" /></svg>Visão geral</a
        ><a href="/contas.html"
          ><svg><use href="/icons.svg#wallet" /></svg>Contas</a
        ><a href="/cartoes.html"
          ><svg><use href="/icons.svg#card" /></svg>Cartões</a
        ><a href="/produtos.html"
          ><svg><use href="/icons.svg#box" /></svg>Produtos</a
        ><a class="active" href="/movimentacoes.html"
          ><svg><use href="/icons.svg#swap" /></svg>Movimentações</a
        ><a href="/configuracoes.html"
          ><svg><use href="/icons.svg#settings" /></svg>Configurações</a
        >
      </nav>
      <div class="sync-box">
        <svg><use href="/icons.svg#shield" /></svg>
        <div><b>Dados protegidos</b><small>Dados atualizados</small></div>
      </div>
    </aside>
    <div class="app record-app">
      <header class="record-header">
        <a class="logo" href="/dashboard.html"><span>M</span>Mercurius</a
        ><a href="/movimentacoes.html">Cancelar</a>
      </header>
      <main class="record-main">
        <div class="record-title">
          <a href="/nova-movimentacao.html">← Alterar tipo</a>
          <h1>Registrar compra</h1>
          <p>Registre uma compra de alimentos.</p>
        </div>
        <form class="record-card" action="/movimentacoes.html">
          <div class="form-grid">
            <label class="full"
              >Descrição<input
                required
                maxlength="500"
                placeholder="Ex.: Compras da semana" /></label
            ><label
              >Nome da loja<input
                required
                maxlength="150"
                placeholder="Ex.: Mercado do Bairro" /></label
            ><label
              >Categoria<select>
                <option>Alimentação</option>
                <option>Hortifruti</option>
                <option>Padaria</option>
                <option>Mercearia</option>
              </select></label
            ><label>Valor<input type="number" required min=".01" step=".01" /></label
            ><label>Data<input type="date" required /></label
            ><label
              >Conta associada<select required>
                <option>Conta principal</option>
                <option>Reserva</option>
              </select></label
            ><label
              >Cartão associado <small>(opcional)</small
              ><select>
                <option>Sem cartão</option>
                <option>Cartão Azul</option>
                <option>Cartão Essencial</option>
              </select></label
            >
          </div>
          <div class="record-actions">
            <a class="button outline" href="/movimentacoes.html">Cancelar</a
            ><button class="button primary">Salvar compra</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
