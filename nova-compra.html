<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Nova compra — Mercurius</title>
  </head>
  <body class="corpo-aplicativo">
    <aside class="barra-lateral">
      <a class="logo claro" href="./index.html">
        <span> M </span>
        Mercurius
      </a>
      <a class="nova-acao" href="./nova-movimentacao.html">
        + Nova movimentação
      </a>
      <nav class="navegacao-lateral">
        <a href="./dashboard.html"> Visão geral </a>
        <a href="./contas.html"> Contas </a>
        <a href="./cartoes.html"> Cartões </a>
        <a href="./produtos.html"> Produtos </a>
        <a class="ativo" href="./movimentacoes.html"> Movimentações </a>
        <a href="./configuracoes.html"> Configurações </a>
      </nav>
      <a class="sair" href="./login.html"> ← Sair da conta </a>
    </aside>
    <div class="aplicativo aplicativo-registro">
      <header class="cabecalho-registro">
        <a class="logo" href="./dashboard.html">
          <span> M </span>
          Mercurius
        </a>
        <a href="./movimentacoes.html"> Cancelar </a>
      </header>
      <main class="principal-registro">
        <div class="titulo-registro">
          <a href="./nova-movimentacao.html"> ← Alterar tipo </a>
          <h1>Registrar compra</h1>
          <p>Registre uma compra de alimentos.</p>
        </div>
        <form class="cartao-registro" action="./movimentacoes.html">
          <div class="grade-formulario">
            <label class="completo">
              Descrição
              <input
                required
                maxlength="500"
                placeholder="Ex.: Compras da semana"
              />
            </label>
            <label>
              Nome da loja
              <input
                required
                maxlength="150"
                placeholder="Ex.: Mercado do Bairro"
              />
            </label>
            <label>
              Categoria
              <select>
                <option>Alimentação</option>
                <option>Hortifruti</option>
                <option>Padaria</option>
                <option>Mercearia</option>
              </select>
            </label>
            <label>
              Valor
              <input type="number" required min=".01" step=".01" />
            </label>
            <label>
              Data
              <input type="date" required />
            </label>
            <label>
              Conta associada
              <select required>
                <option>Conta principal</option>
                <option>Reserva</option>
              </select>
            </label>
            <label>
              Cartão associado
              <small> (opcional) </small>
              <select>
                <option>Sem cartão</option>
                <option>Cartão Azul</option>
                <option>Cartão Essencial</option>
              </select>
            </label>
          </div>
          <div class="acoes-registro">
            <a class="botao contorno" href="./movimentacoes.html"> Cancelar </a>
            <button class="botao primario">Salvar compra</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
